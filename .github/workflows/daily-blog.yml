name: Create Accessibility Blog Draft

on:
  workflow_dispatch:

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate an unpublished draft
        env:
          # This securely gets the API key from your GitHub secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-blog.js

      - name: Upload unpublished draft for review
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-blog-draft
          path: drafts/*.json
          if-no-files-found: error
          retention-days: 7

