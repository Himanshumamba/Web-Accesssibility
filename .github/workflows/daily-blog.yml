name: Monthly Auto Blog Post

on:
  schedule:
    # Runs automatically on the 1st day of every month at 12:00 PM UTC
    - cron: '0 12 1 * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button in GitHub

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Blog Post
        env:
          # This securely gets the API key from your GitHub secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-blog.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add blog-posts.json
          git commit -m "Auto-generated monthly blog post" || echo "No changes to commit"
          git pull --rebase origin main
          git push

